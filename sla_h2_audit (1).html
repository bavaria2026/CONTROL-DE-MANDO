<style>
:root {
  --bg:#f5f6fa; --card:#fff; --text:#1a1b2e; --muted:#6b7280; --border:#e5e7eb;
  --green:#10b981; --green-bg:#ecfdf5; --amber:#f59e0b; --amber-bg:#fffbeb;
  --red:#ef4444; --red-bg:#fef2f2; --blue:#3b82f6; --blue-bg:#eff6ff;
  --purple:#8b5cf6; --indigo:#6366f1; --teal:#14b8a6;
  --header-from:#0f172a; --header-to:#1e3a5f; --accent:#38bdf8;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--card:#1a1d2e;--text:#e2e8f0;--muted:#94a3b8;--border:#2d3348;
  --green-bg:#052e16;--amber-bg:#451a03;--red-bg:#450a0a;--blue-bg:#172554;
}}
:root[data-theme="dark"]{
  --bg:#0f1117;--card:#1a1d2e;--text:#e2e8f0;--muted:#94a3b8;--border:#2d3348;
  --green-bg:#052e16;--amber-bg:#451a03;--red-bg:#450a0a;--blue-bg:#172554;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif}
.header{background:linear-gradient(135deg,var(--header-from),var(--header-to));color:#fff;padding:28px 24px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.header-photo{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);object-fit:cover}
.header-info h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.header-info p{font-size:.85rem;opacity:.8;margin-top:2px}
.header-badge{margin-left:auto;background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);border-radius:8px;padding:8px 16px;font-size:.8rem;font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--accent)}
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}
.tab{padding:14px 24px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted);transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--indigo);border-bottom-color:var(--indigo)}
.content{max-width:1400px;margin:0 auto;padding:20px 16px}
.section{display:none}.section.active{display:block}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:var(--card);border-radius:12px;padding:16px 18px;border-left:4px solid var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi-card.green{border-left-color:var(--green)}.kpi-card.amber{border-left-color:var(--amber)}.kpi-card.red{border-left-color:var(--red)}
.kpi-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;margin:4px 0}
.kpi-sub{font-size:.75rem;color:var(--muted)}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:1rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:8px 10px;background:var(--bg);font-weight:600;font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover{background:var(--bg)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.sub-tab{padding:6px 14px;border-radius:8px;font-size:.8rem;font-weight:500;cursor:pointer;background:var(--bg);color:var(--muted);border:1px solid var(--border);transition:all .2s}
.sub-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.table-scroll{max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.att-bar{height:6px;border-radius:3px;background:var(--bg);margin-top:4px}
.att-fill{height:100%;border-radius:3px}
.anaplan-card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:3px solid var(--indigo)}
.anaplan-title{font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:600;margin-bottom:4px}
.anaplan-unit{font-size:.7rem;color:var(--muted)}
.anaplan-val{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;margin:6px 0 2px}
.anaplan-delta{font-size:.72rem;font-weight:600}
</style>

function statusColor(v){return v>=95?'green':v>=80?'amber':'red'}
function statusLabel(v){return v>=95?'Cumple':v>=80?'En riesgo':'No cumple'}
function badgeHtml(v){
  if(v===null||v===undefined)return'<span class="badge" style="background:#f3f4f6;color:#9ca3af">—</span>';
  const c=statusColor(v);return`<span class="badge badge-${c}">${v.toFixed(1)}%</span>`
}
function sparkSvg(values,w=120,h=32){
  const vals=values.filter(v=>v!==null);if(!vals.length)return'';
  const mn=Math.min(...vals)-2,mx=Math.max(...vals)+2,range=mx-mn||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1||1))*w,h-(v-mn)/range*h]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const col=vals[vals.length-1]>=95?'var(--green)':vals[vals.length-1]>=80?'var(--amber)':'var(--red)';
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/></svg>`
}
function barChart(labels,values,w=null,h=180,meta=null){
  const n=labels.length;if(!n)return'';
  const cw=w||Math.max(n*50,300);const pad=30,bw=Math.min(28,(cw-60)/n-4);
  const mx=Math.max(100,...values.filter(v=>v!==null));
  let svg=`<svg width="${cw}" height="${h+40}" viewBox="0 0 ${cw} ${h+40}">`;
  for(let p of[80,90,95,100]){const y=h-(p/mx)*h+10;
    svg+=`<line x1="30" y1="${y}" x2="${cw-10}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,3"/>`;
    svg+=`<text x="26" y="${y+4}" font-size="9" fill="var(--muted)" text-anchor="end">${p}</text>`}
  if(meta){const my=h-(meta/mx)*h+10;
    svg+=`<line x1="30" y1="${my}" x2="${cw-10}" y2="${my}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,3"/>`;
    svg+=`<text x="${cw-8}" y="${my-3}" font-size="8" fill="var(--red)" text-anchor="end">Meta ${meta}%</text>`}
  const startX=40,gap=(cw-startX-20)/n;
  values.forEach((v,i)=>{if(v===null)return;
    const x=startX+i*gap+gap/2-bw/2,bh=(v/mx)*h,y=h-bh+10;
    const col=v>=95?'var(--green)':v>=80?'var(--amber)':'var(--red)';
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${col}" opacity=".85"/>`;
    svg+=`<text x="${x+bw/2}" y="${y-4}" font-size="9" font-weight="600" fill="var(--text)" text-anchor="middle">${v.toFixed(1)}</text>`;
    svg+=`<text x="${x+bw/2}" y="${h+25}" font-size="9" fill="var(--muted)" text-anchor="middle">${labels[i]}</text>`});
  svg+='</svg>';return`<div style="overflow-x:auto">${svg}</div>`
}
function dualBarChart(labels,ac,bu,w=null,h=160){
  const n=labels.length;if(!n)return'';
  const cw=w||Math.max(n*60,350);
  const allVals=[...ac,...bu].filter(v=>v!==null&&v!==0);
  if(!allVals.length)return'<p style="color:var(--muted);font-size:.8rem">Sin datos</p>';
  const mx=Math.max(...allVals)*1.15;const mn=Math.min(0,...allVals);
  const bw=Math.min(14,(cw-60)/n/2.5);
  let svg=`<svg width="${cw}" height="${h+45}" viewBox="0 0 ${cw} ${h+45}">`;
  // Grid
  const steps=4;for(let i=0;i<=steps;i++){
    const val=mn+(mx-mn)*i/steps;const y=h-(i/steps)*h+10;
    svg+=`<line x1="45" y1="${y}" x2="${cw-10}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>`;
    svg+=`<text x="42" y="${y+3}" font-size="8" fill="var(--muted)" text-anchor="end">${val>=1000?(val/1000).toFixed(0)+'k':val.toFixed(val<10?2:0)}</text>`}
  const startX=55,gap=(cw-startX-15)/n;
  labels.forEach((l,i)=>{
    const x=startX+i*gap+gap/2;
    // AC bar
    if(ac[i]!=null&&ac[i]!==0){const bh=((ac[i]-mn)/(mx-mn))*h;const y=h-bh+10;
      svg+=`<rect x="${x-bw-1}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--indigo)" opacity=".8"/>`}
    // BU bar
    if(bu[i]!=null&&bu[i]!==0){const bh=((bu[i]-mn)/(mx-mn))*h;const y=h-bh+10;
      svg+=`<rect x="${x+1}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--teal)" opacity=".5"/>`}
    svg+=`<text x="${x}" y="${h+25}" font-size="8" fill="var(--muted)" text-anchor="middle">${l}</text>`});
  // Legend
  svg+=`<rect x="${cw-130}" y="${h+32}" width="10" height="10" rx="2" fill="var(--indigo)" opacity=".8"/>`;
  svg+=`<text x="${cw-116}" y="${h+41}" font-size="8" fill="var(--muted)">Actual</text>`;
  svg+=`<rect x="${cw-70}" y="${h+32}" width="10" height="10" rx="2" fill="var(--teal)" opacity=".5"/>`;
  svg+=`<text x="${cw-56}" y="${h+41}" font-size="8" fill="var(--muted)">Budget</text>`;
  svg+='</svg>';return`<div style="overflow-x:auto">${svg}</div>`
}
function ringGauge(value,size=100){
  if(value===null||value===undefined)return'';
  const r=size/2-8,circ=2*Math.PI*r,pct=Math.min(value/100,1);
  const col=value>=95?'var(--green)':value>=80?'var(--amber)':'var(--red)';
  const c=size/2;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border)" stroke-width="8"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="8"
      stroke-dasharray="${circ*pct} ${circ*(1-pct)}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c+2}" text-anchor="middle" dominant-baseline="middle"
      font-family="Space Grotesk" font-size="${size/4.5}" font-weight="700" fill="var(--text)">${value.toFixed(1)}%</text></svg>`
}

  h+='</div>';
  h+='<div class="card"><h3>📋 Detalle Compromisos T1 / T2</h3><div class="table-scroll"><table><thead><tr><th>#</th><th>Compromiso</th><th>KPI</th><th>Meta</th><th>YTD</th>';
  s.labels.forEach(l=>h+=`<th>${l}</th>`);h+='<th>Trend</th></tr></thead><tbody>';

    h+=`<tr><td>${i+1}</td><td style="max-width:260px;font-size:.75rem">${item.name}</td><td style="font-size:.72rem">${item.kpi}</td><td style="font-size:.72rem">${item.meta}</td><td>${badgeHtml(item.ytd)}</td>`;
    item.monthly.forEach(v=>h+=`<td>${badgeHtml(v)}</td>`);
    h+=`<td>${sparkSvg(item.monthly)}</td></tr>`});
  h+='</tbody></table></div></div>';
  el.innerHTML=h}

  h+='</div>';
  h+='<div class="sub-tabs" id="oluc-subtabs"><div class="sub-tab active" data-sub="oluc-seg">Seguimiento SLA</div><div class="sub-tab" data-sub="oluc-tct">SLA TCT</div><div class="sub-tab" data-sub="oluc-att">Asistencia</div></div>';
  // Seg
  h+='<div class="card" id="oluc-seg"><h3>📋 Detalle OL-UC</h3><div class="table-scroll"><table><thead><tr><th>#</th><th>Compromiso</th><th>KPI</th><th>YTD</th>';
  s.labels.forEach(l=>h+=`<th>${l}</th>`);h+='<th>Trend</th></tr></thead><tbody>';
  s.items.forEach((item,i)=>{
    h+=`<tr><td>${i+1}</td><td style="max-width:240px;font-size:.75rem">${item.name}</td><td style="font-size:.72rem">${item.kpi}</td><td>${badgeHtml(item.ytd)}</td>`;
    const vals=item.monthly.filter(v=>v!==null);vals.forEach(v=>h+=`<td>${badgeHtml(v)}</td>`);
    for(let x=vals.length;x<s.labels.length;x++)h+='<td>—</td>';
    h+=`<td>${sparkSvg(vals)}</td></tr>`});
  h+='</tbody></table></div></div>';
  // TCT
  h+='<div class="card" id="oluc-tct" style="display:none"><h3>🔧 SLA TCT</h3><div class="table-scroll"><table><thead><tr><th>#</th><th>Compromiso</th><th>KPI</th><th>Promedio</th><th>Trend</th></tr></thead><tbody>';
  s.tct.forEach((item,i)=>{
    h+=`<tr><td>${i+1}</td><td style="max-width:300px;font-size:.75rem">${item.name}</td><td style="font-size:.72rem">${item.kpi}</td><td>${badgeHtml(item.avg)}</td><td>${sparkSvg(item.weekly,150)}</td></tr>`});
  h+='</tbody></table></div></div>';
  // Att
  h+='<div class="card" id="oluc-att" style="display:none"><h3>📅 Asistencia Diaria</h3><table><thead><tr><th>Cargo</th><th>Nombre</th><th>%</th><th></th></tr></thead><tbody>';
  s.daily_att.forEach(p=>{const col=p.pct>=90?'var(--green)':p.pct>=70?'var(--amber)':'var(--red)';
    h+=`<tr><td style="font-size:.75rem">${p.cargo}</td><td style="font-size:.75rem">${p.name}</td><td style="font-weight:600;color:${col}">${p.pct}%</td><td style="width:120px"><div class="att-bar"><div class="att-fill" style="width:${p.pct}%;background:${col}"></div></div></td></tr>`});

  el.innerHTML=h;

    document.querySelectorAll('#oluc-subtabs .sub-tab').forEach(s2=>s2.classList.remove('active'));st.classList.add('active');
    ['oluc-seg','oluc-tct','oluc-att'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display=st.dataset.sub===id?'block':'none'})})})
}

// ============ COMERCIAL ============
function renderCom(){
  const s=D.com;const el=document.getElementById('sec-com');let h='';
  h+='<div class="kpi-row">';
  ['Oriente','Occidente','Poblaciones'].forEach(rn=>{
    const ov=s.regions[rn].overall;const last=ov.filter(v=>v!==null);
    const avg=last.length?last.reduce((a,b)=>a+b,0)/last.length:0;const col=statusColor(avg);
    h+=`<div class="kpi-card ${col}"><div class="kpi-label">${rn}</div><div class="kpi-value" style="color:var(--${col})">${avg.toFixed(1)}%</div><div class="kpi-sub">Prom. Feb-Nov</div></div>`});
  h+='</div>';
  h+='<div class="sub-tabs" id="com-subtabs">';
  ['Oriente','Occidente','Poblaciones','Asistencia'].forEach((rn,i)=>{h+=`<div class="sub-tab ${i===0?'active':''}" data-sub="com-${rn.toLowerCase()}">${rn}</div>`});
  h+='</div>';
  ['Oriente','Occidente','Poblaciones'].forEach(rn=>{
    const rd=s.regions[rn];
    h+=`<div id="com-${rn.toLowerCase()}" style="display:${rn==='Oriente'?'block':'none'}">`;
    h+='<div class="card"><h3>📊 Tendencia — '+rn+'</h3>'+barChart(s.labels,rd.overall,null,180,95)+'</div>';
    h+='<div class="card"><h3>📦 Logísticos</h3><div class="table-scroll"><table><thead><tr><th>#</th><th>Compromiso</th><th>KPI</th>';
    s.labels.forEach(l=>h+=`<th>${l}</th>`);h+='</tr></thead><tbody>';
    rd.logistica.forEach((item,i)=>{h+=`<tr><td>${i+1}</td><td style="max-width:240px;font-size:.73rem">${item.name}</td><td style="font-size:.72rem">${item.kpi}</td>`;item.monthly.forEach(v=>h+=`<td>${badgeHtml(v)}</td>`);h+='</tr>'});
    h+='</tbody></table></div></div>';
    h+='<div class="card"><h3>🤝 Comerciales</h3><div class="table-scroll"><table><thead><tr><th>#</th><th>Compromiso</th><th>KPI</th>';
    s.labels.forEach(l=>h+=`<th>${l}</th>`);h+='</tr></thead><tbody>';
    rd.comercial.forEach((item,i)=>{h+=`<tr><td>${i+1}</td><td style="max-width:240px;font-size:.73rem">${item.name}</td><td style="font-size:.72rem">${item.kpi}</td>`;item.monthly.forEach(v=>h+=`<td>${badgeHtml(v)}</td>`);h+='</tr>'});
    h+='</tbody></table></div></div></div>'});
  h+='<div id="com-asistencia" style="display:none">';
  s.attendance.forEach(att=>{h+=`<div class="card"><h3>📅 ${att.name}</h3><table><thead><tr><th>Cargo</th><th>Nombre</th><th>%</th><th></th></tr></thead><tbody>`;
    att.people.forEach(p=>{const col=p.pct>=90?'var(--green)':p.pct>=70?'var(--amber)':'var(--red)';
      h+=`<tr><td style="font-size:.75rem">${p.cargo}</td><td style="font-size:.75rem">${p.name}</td><td style="font-weight:600;color:${col}">${p.pct}%</td><td style="width:120px"><div class="att-bar"><div class="att-fill" style="width:${p.pct}%;background:${col}"></div></div></td></tr>`});
    h+='</tbody></table></div>'});h+='</div>';
  el.innerHTML=h;
  document.querySelectorAll('#com-subtabs .sub-tab').forEach(st=>{st.addEventListener('click',()=>{
    document.querySelectorAll('#com-subtabs .sub-tab').forEach(s2=>s2.classList.remove('active'));st.classList.add('active');
    ['com-oriente','com-occidente','com-poblaciones','com-asistencia'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display=st.dataset.sub===id?'block':'none'})})})
}

// ============ ANAPLAN ============
function renderAnaplan(){
  const ap=D.anaplan;const el=document.getElementById('sec-anaplan');let h='';
  h+='<div class="card"><h3>📊 KPIs Operativos Anaplan — DC Autosur (Ene–Oct 2026)</h3><p style="font-size:.8rem;color:var(--muted);margin-bottom:16px">Datos de Anaplan. Barras azules = Actual (AC), barras teal = Budget (BU).</p></div>';
  // Group KPIs into categories
  const groups = {
    'Volumen & Productividad': ['DC-K0010','DC-K1600','DC-K1017','DC-K1601'],
    'Transporte': ['DC-K2230','DC-R2230','DC-K2200','DC-K2310','DC-K2205','DC-K2210','DC-K2220','DC-K3200'],
    'Calidad & NPS': ['DC-K1279','DC-K1275','DC-K1276','DC-K0030','DC-R2915'],
    'Comercial': ['DC-K2920','DC-R2901'],
  };
  for(const[gname, codes] of Object.entries(groups)){
    h+=`<div class="card"><h3>📈 ${gname}</h3><div class="grid-3">`;
    codes.forEach(code=>{
      const d=ap[code];if(!d)return;
      const lastAC=d.ac[d.ac.length-1];const lastBU=d.bu[d.bu.length-1];
      const delta=lastBU?((lastAC-lastBU)/lastBU*100):0;
      const deltaCol=delta>=0?'var(--green)':'var(--red)';
      const deltaSign=delta>=0?'+':'';
      h+=`<div class="anaplan-card">`;
      h+=`<div class="anaplan-title">${d.name}</div>`;
      h+=`<div class="anaplan-unit">${d.unit} · ${d.labels[d.labels.length-1]} 2026</div>`;
      h+=`<div class="anaplan-val">${lastAC>=10000?(lastAC/1000).toFixed(1)+'k':lastAC.toFixed(lastAC<10?2:1)}</div>`;
      if(lastBU)h+=`<div class="anaplan-delta" style="color:${deltaCol}">${deltaSign}${delta.toFixed(1)}% vs BU</div>`;
      h+=dualBarChart(d.labels,d.ac,d.bu,280,120);
      h+=`</div>`;
    });
    h+='</div></div>';
  }
  // Summary table
  h+='<div class="card"><h3>📋 Resumen KPIs — Último Mes vs Budget</h3><div class="table-scroll"><table><thead><tr><th>KPI</th><th>Unidad</th><th>Último Mes</th><th>Actual</th><th>Budget</th><th>Δ vs BU</th></tr></thead><tbody>';
  for(const[code,d] of Object.entries(ap)){
    const lm=d.labels[d.labels.length-1];const ac=d.ac[d.ac.length-1];const bu=d.bu[d.bu.length-1];
    const delta=bu?((ac-bu)/bu*100):0;const col=delta>=0?'var(--green)':'var(--red)';
    h+=`<tr><td style="font-size:.75rem;font-weight:500">${d.name}</td><td style="font-size:.72rem;color:var(--muted)">${d.unit}</td><td>${lm}</td>`;
    h+=`<td style="font-weight:600">${ac>=10000?(ac/1000).toFixed(1)+'k':ac.toFixed(ac<10?2:1)}</td>`;
    h+=`<td style="color:var(--muted)">${bu>=10000?(bu/1000).toFixed(1)+'k':bu.toFixed(bu<10?2:1)}</td>`;
    h+=`<td style="font-weight:600;color:${col}">${delta>=0?'+':''}${delta.toFixed(1)}%</td></tr>`}
  h+='</tbody></table></div></div>';
  el.innerHTML=h}

// Tab switching
document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  tab.classList.add('active');document.getElementById('sec-'+tab.dataset.tab).classList.add('active')})});
renderT1T2();renderOLUC();renderCom();renderAnaplan();
</script>
