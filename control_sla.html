const lv=a=>{for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return a[i];return null};
const st=(v,m)=>v==null?{l:'Sin datos',c:'m',co:'#94A3B8'}:v>=m?{l:'Cumple',c:'g',co:'#059669'}:v>=m*.9?{l:'En riesgo',c:'a',co:'#D97706'}:{l:'No cumple',c:'r',co:'#DC2626'};

function spark(data,color,w=90,h=22){
  const vd=data.map((v,i)=>v!=null?{x:i,y:v}:null).filter(Boolean);
  if(vd.length<2)return'';
  const mn=Math.min(...vd.map(p=>p.y)),mx=Math.max(...vd.map(p=>p.y)),rng=mx-mn||1;
  const pts=vd.map(p=>`${p.x/(data.length-1)*w},${h-2-(p.y-mn)/rng*(h-4)}`).join(' ');
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polygon points="${pts} ${w},${h} 0,${h}" fill="${color}12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function bars(data,labels,meta,colors,h=160){
  const n=labels.length,bw=Math.min(38,200/n),gap=bw+14,w=n*gap+20;
  const my=h-meta/100*h;
  let s=`<svg viewBox="0 0 ${w} ${h+22}" style="width:100%;max-height:210px">`;
  s+=`<line x1="0" y1="${my}" x2="${w}" y2="${my}" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3"/>`;
  s+=`<text x="${w-2}" y="${my-4}" text-anchor="end" font-size="8" fill="#059669" font-weight="600">Meta ${meta}%</text>`;
  data.forEach((v,i)=>{if(v==null)return;const bh=v/100*h,x=i*gap+10;
    s+=`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="3" fill="${colors[i]||P[i]}" opacity=".8"/>`;
    s+=`<text x="${x+bw/2}" y="${h-bh-5}" text-anchor="middle" font-size="10" font-weight="700" font-family="JetBrains Mono" fill="${colors[i]}">${v.toFixed(1)}%</text>`;
    s+=`<text x="${x+bw/2}" y="${h+14}" text-anchor="middle" font-size="10" font-weight="600" fill="#64748B">${labels[i]}</text>`;
  });
  return s+'</svg>';
}

function ring(v,mt,size=52){
  const pc=v!=null?Math.min(v/100,1):0,ci=2*Math.PI*20,of=ci*(1-pc),x=st(v,mt);
  return`<div class="rg" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="rb" cx="${size/2}" cy="${size/2}" r="20"/><circle class="rf" cx="${size/2}" cy="${size/2}" r="20" stroke="${x.co}" stroke-dasharray="${ci}" stroke-dashoffset="${of}"/></svg><div class="rl" style="color:${x.co}">${v!=null?Math.round(v)+'%':'—'}</div></div>`;
}

let cur='comercial';

function render(){
  // Tabs
  document.getElementById('tabs').innerHTML=FILES.map(f=>`<button class="tab ${cur===f.id?'on':''}" onclick="cur='${f.id}';render()">${f.icon} ${f.name}</button>`).join('');
  const F=FILES.find(f=>f.id===cur);
  const fc=FC[F.color];
  let h=`<div class="file-hdr" style="background:linear-gradient(135deg,${fc[0]},#fff);border-color:${fc[1]}">
    <span class="ficon">${F.icon}</span>
    <div><div class="fname">${F.name}</div><div class="fmeta">📄 ${F.file}</div><div class="fmeta">Hojas: ${F.sheets}</div></div></div>`;

  if(F.id==='anaplan'){h+=renderAnaplan(F);document.getElementById('main').innerHTML=h;return}

  // SLA subs
  F.subs.forEach((s,si)=>{
    const v=lv(s.mo),x=st(v,s.mt);
    const prev=s.mo.filter(x=>x!=null);const tr=prev.length>=2?prev[prev.length-1]-prev[prev.length-2]:0;
    // Header card
    h+=`<div class="bx" style="border-left:4px solid ${x.co}"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div><div class="bt">${s.name} <span class="bg ${x.c}" style="margin-left:8px">${x.l}</span></div><div class="bs">${s.al} · ${s.cd} · Meta: ${s.mt}%</div></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="text-align:right"><div style="font-size:1.6rem;font-weight:800;font-family:'JetBrains Mono';letter-spacing:-1px;color:${x.co}">${v!=null?v.toFixed(1)+'%':'—'}</div>
        ${tr?`<div style="font-size:.68rem;font-weight:600;color:${tr>0?'#059669':'#DC2626'}">${tr>0?'▲':'▼'}${Math.abs(tr).toFixed(1)}pp vs mes anterior</div>`:''}</div>
        ${ring(v,s.mt)}</div></div></div>`;
    // Bar chart
    const lb=[],vals=[],cols=[];
    M.forEach((m,i)=>{if(s.mo[i]!=null){lb.push(m);vals.push(s.mo[i]);cols.push(st(s.mo[i],s.mt).co)}});
    h+=`<div class="bx"><div class="bt">Tendencia mensual</div><div class="bs">Ene–May 2026 vs Meta ${s.mt}%</div>${bars(vals,lb,s.mt,cols)}</div>`;
    // KPIs
    h+='<div class="kg">';
    Object.entries(s.kp).forEach(([k,vs],idx)=>{
      const kv=lv(vs);const prev2=vs.filter(x=>x!=null);const dl=prev2.length>=2?prev2[prev2.length-1]-prev2[prev2.length-2]:0;
      h+=`<div class="kb" style="background:${BG[idx%8]};border:1px solid ${BD[idx%8]}"><div class="kn">${k}</div><div class="kv" style="color:${P[idx%8]}">${kv!=null?kv.toFixed(1):'—'}</div>${dl?`<div class="kd" style="color:${dl>0?'#059669':'#DC2626'}">${dl>0?'▲':'▼'}${Math.abs(dl).toFixed(1)}</div>`:''}${spark(vs,P[idx%8])}</div>`;
    });
    h+='</div>';
    // Detail table
    h+='<div class="bx"><div class="bt">Detalle por mes</div><div class="bs">Todos los indicadores</div><div style="overflow-x:auto"><table class="tb"><thead><tr><th>Indicador</th>';
    M.forEach(m=>h+=`<th style="text-align:center">${m}</th>`);
    h+='</tr></thead><tbody>';
    Object.entries(s.kp).forEach(([k,vs])=>{
      h+=`<tr><td style="font-weight:600;font-family:DM Sans;color:#1E293B">${k}</td>`;
      vs.forEach(v=>h+=v==null?'<td class="vm" style="text-align:center">—</td>':`<td class="${v>=80?'vg':v>=50?'va':'vr'}" style="text-align:center">${v.toFixed(1)}</td>`);
      h+='</tr>';
    });
    h+=`<tr style="background:#F8FAFC"><td style="font-weight:700;color:#1E40AF">SLA Total</td>`;
    s.mo.forEach(v=>h+=v==null?'<td class="vm" style="text-align:center">—</td>':`<td style="text-align:center;color:${st(v,s.mt).co};font-weight:700">${v.toFixed(1)}%</td>`);
    h+='</tr></tbody></table></div></div>';
  });

  // Correlación (T1T2)
  if(F.corr){
    h+=`<div class="bx" style="border-left:4px solid #7C3AED"><div class="bt">📊 Correlación SLA ↔ Anaplan</div><div class="bs">Hoja: Correlación · Coeficiente R</div></div>`;
    h+='<div class="kg">';
    Object.entries(F.corr).forEach(([k,v],i)=>{
      const cols2=['#2563EB','#0891B2','#7C3AED','#DB2777'];
      const str=Math.abs(v.r)>=0.7?'Fuerte':Math.abs(v.r)>=0.4?'Moderada':'Débil';
      h+=`<div class="kb" style="background:${BG[i]};border:1px solid ${BD[i]}"><div class="kn">${k}</div><div class="kv" style="color:${cols2[i]}">R = ${v.r.toFixed(2)}</div><div class="kd" style="color:#64748B">${str}</div>${spark(v.ac,cols2[i],80,18)}</div>`;
    });
    h+='</div>';
    h+='<div class="bx"><div class="bt">Valores mensuales</div><div style="overflow-x:auto"><table class="tb"><thead><tr><th>Indicador</th>';
    M.forEach(m=>h+=`<th style="text-align:center">${m}</th>`);
    h+='<th style="text-align:center">BU</th><th style="text-align:center">R</th><th>Fuerza</th></tr></thead><tbody>';
    Object.entries(F.corr).forEach(([k,v])=>{
      const str=Math.abs(v.r)>=0.7?'Fuerte':Math.abs(v.r)>=0.4?'Moderada':'Débil';
      h+=`<tr><td style="font-weight:600;font-family:DM Sans">${k}</td>`;
      v.ac.forEach(x=>h+=`<td style="text-align:center">${x.toFixed(1)}</td>`);
      h+=`<td style="text-align:center;color:#64748B">${v.bu}</td><td class="${Math.abs(v.r)>=0.7?'vg':Math.abs(v.r)>=0.4?'va':'vr'}" style="text-align:center">${v.r.toFixed(2)}</td><td><span class="bg ${Math.abs(v.r)>=0.7?'g':Math.abs(v.r)>=0.4?'a':'r'}">${str}</span></td></tr>`;
    });
    h+='</tbody></table></div></div>';
  }

  // Asistencia
  if(F.asist){
    h+=`<div class="bx" style="border-left:4px solid #0891B2"><div class="bt">👥 Asistencia</div><div class="bs">Hoja: ${F.id==='comercial'?'Asistencia Comercial':'Asistencia Diaria'}</div>`;
    if(F.asist.status){
      h+=`<div style="padding:16px;text-align:center;color:#94A3B8;font-size:.8rem">⚠️ ${F.asist.status}</div>`;
      h+='<div class="att-grid">';
      F.asist.nombres.forEach((n,i)=>h+=`<div class="att-person"><div class="aname">${n}</div><div class="arole">${F.asist.empresas[i]}</div></div>`);
      h+='</div>';
    } else {
      // Show attendance bar chart
      const apct=F.asist.pct;
      const aMonthly=[];
      for(let i=0;i<5;i++){const chunk=apct.slice(i*4,(i+1)*4).filter(Boolean);aMonthly.push(chunk.length?Math.round(chunk.reduce((a,b)=>a+b,0)/chunk.length*100)/100:null)}
      const aCols=aMonthly.map(v=>v!=null&&v>=90?'#059669':v!=null&&v>=80?'#D97706':'#DC2626');
      h+=bars(aMonthly.map(v=>v!=null?v*100:null),M,90,aCols,130);
      h+='<div class="att-grid" style="margin-top:10px">';
      F.asist.nombres.forEach((n,i)=>h+=`<div class="att-person"><div class="aname">${n}</div><div class="arole">${F.asist.cargos[i]}</div></div>`);
      h+='</div>';
    }
    h+='</div>';
  }
  document.getElementById('main').innerHTML=h;
}

function renderAnaplan(F){
  let h='';
  const mx=Math.max(...Object.values(F.anaplan).map(v=>Math.max(v.ac,v.bu,v.ly)));
  h+='<div class="kg">';
  Object.entries(F.anaplan).forEach(([k,v],i)=>{
    const diff=v.ac-v.bu;const good=v.d==='lb'?diff<=0:diff>=0;
    h+=`<div class="kb" style="background:${BG[i%8]};border:1px solid ${BD[i%8]}"><div class="kn">${k}</div><div class="kv" style="color:${P[i%8]}">${v.ac.toFixed(2)}</div><div class="kd" style="color:${good?'#059669':'#DC2626'}">vs BU: ${diff>=0?'+':''}${diff.toFixed(2)} <span class="bg ${good?'g':'r'}">${good?'✓':'✗'}</span></div></div>`;
  });
  h+='</div>';
  h+='<div class="bx"><div class="bt">Performance AC vs Budget vs LY</div><div class="bs">DC Autosur · YTD Mayo 2026</div>';
  Object.entries(F.anaplan).forEach(([k,v],i)=>{
    const diff=v.ac-v.bu;const good=v.d==='lb'?diff<=0:diff>=0;
    const maxV=Math.max(v.ac,v.bu,v.ly)||1;
    h+=`<div style="margin-bottom:12px"><div style="font-size:.72rem;font-weight:600;color:#334155;margin-bottom:4px">${k} <span class="bg ${good?'g':'r'}" style="margin-left:6px">${good?'On Track':'Gap'}</span></div>
    <div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span style="font-size:.55rem;color:#94A3B8;width:22px">AC</span><div style="flex:1;height:20px;background:#F1F5F9;border-radius:4px;overflow:hidden"><div style="width:${v.ac/maxV*100}%;height:100%;background:${P[i%8]};border-radius:4px;display:flex;align-items:center;padding:0 6px"><span style="font-size:.6rem;color:#fff;font-weight:700;font-family:JetBrains Mono">${v.ac.toFixed(2)}</span></div></div></div>
    <div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span style="font-size:.55rem;color:#94A3B8;width:22px">BU</span><div style="flex:1;height:14px;background:#F1F5F9;border-radius:3px;overflow:hidden"><div style="width:${v.bu/maxV*100}%;height:100%;background:#94A3B8;border-radius:3px;display:flex;align-items:center;padding:0 6px"><span style="font-size:.55rem;color:#fff;font-weight:600;font-family:JetBrains Mono">${v.bu.toFixed(2)}</span></div></div></div>
    <div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span style="font-size:.55rem;color:#94A3B8;width:22px">LY</span><div style="flex:1;height:14px;background:#F1F5F9;border-radius:3px;overflow:hidden"><div style="width:${v.ly/maxV*100}%;height:100%;background:#CBD5E1;border-radius:3px;display:flex;align-items:center;padding:0 6px"><span style="font-size:.55rem;color:#64748B;font-weight:600;font-family:JetBrains Mono">${v.ly.toFixed(2)}</span></div></div></div></div>`;
  });
  h+='</div>';
  return h;
}

document.addEventListener('DOMContentLoaded',render);
